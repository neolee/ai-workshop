# 运行参数 —— 年份、指标、路径、取整规则
#
# 修改年份集合或指标定义需同步 SPEC.md。

years: [2000, 2005, 2010, 2015, 2020, 2022, 2023, 2024, 2025]

# 交付指标：顺序即交付表的指标块顺序
indicators:
  - key: gdp_usd
    label: 区域GDP
    unit: 亿美元
    decimals: 1
  - key: primacy_pct
    label: 经济首位度
    unit: "%"
    decimals: 2
  - key: gdp_per_capita_usd
    label: 人均GDP
    unit: 美元/人
    decimals: 0
  - key: gdp_per_km2_usd
    label: 地均GDP
    unit: 美元/km²
    decimals: 0

# 世界银行指标
fx_indicator: PA.NUS.FCRF
country_gdp_indicator: NY.GDP.MKTP.CD

# 相对路径，均相对于项目根目录
paths:
  db: data/db/city_gdp.sqlite
  raw: data/raw
  manual: data/manual
  output_dir: output
  qa_dir: output/qa

output:
  workbook: output/城市GDP分析.xlsx
  registry: output/数据来源登记表.xlsx
  notes: output/数据说明.md

# 多源冲突时显式指定采纳源，格式：{city_code: {indicator: source_id}}
# 例：NYC: {population: CENSUS-PEP-2024}
adopted_source: {}

# 校验阈值
validation:
  primacy_bounds: [0.0, 100.0]
  anchor_tolerance: 0.005
  yoy_bounds: [-0.25, 0.45]
  fx_bounds:
    CNY: [6.0, 9.0]
    JPY: [75.0, 170.0]     # 2011 年均 79.8，2010 为 87.8，区间需覆盖历史极值
    GBP: [0.50, 0.95]
    SGD: [1.20, 1.80]
    HKD: [7.70, 7.90]
  per_capita_bounds: [2000, 250000]        # 美元/人（含 2000 年中国城市约 3000）
  density_bounds: [1000000, 2500000000]    # 美元/km²
  magnitude:
    CNY: [1.0e+11, 2.0e+13]                # 中国城市 GDP（元）
    JPY: [1.0e+14, 2.0e+14]                # 东京都内総生産（日元）

# SPEC §4.3 判定的不可得组合；白名单之外的空值视为错误（R9）
known_missing:
  - [NYC, 2000]
  - [NYC, 2025]
  - [LDN, 2025]
  - [TYO, 2000]
  - [TYO, 2005]
  - [TYO, 2010]
  - [TYO, 2024]
  - [TYO, 2025]
