[project]
name = "showcases"
version = "0.1.0"
description = "Workspace for lecture showcases"
readme = "README.md"
authors = [
    { name = "Neo Lee", email = "neo.lee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "xlrd>=2.0",
    "pypdf>=5.0",
]

[project.scripts]
citygdp = "citygdp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citygdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
